# Continuous integration for dsh-mcp-mgr.
#
# Mirrors what `pnpm check` does locally, for both packages: typecheck, build,
# then the two verifiers that catch what types cannot — the Typert descriptor
# contract (verify-typert, in the host package) and the browser bundle's slot
# registrations behind a stub module loader (verify-client, in the UI package).
#
# The peer dependencies (@deepseek-ai/*) are published on npm, so a clean
# checkout really does install. `pnpm/action-setup` reads `packageManager` from
# the root manifest, which is why no version is repeated here.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Read-only: this workflow never writes to the repository.
permissions:
  contents: read

# One run per branch/PR; a new push cancels the in-progress run instead of queueing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  check:
    name: typecheck · build · verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Version comes from the root package.json "packageManager" (pnpm@11.20.0).
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Both packages declare "node": "^22.19.0 || >=24.0.0".
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check both packages
        run: pnpm check

      - name: Prove the workspace packs
        run: |
          pnpm --filter dsh-mcp-mgr pack
          pnpm --filter dsh-mcp-mgr-ui pack
